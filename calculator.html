<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scientific Calculator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: "Segoe UI", Arial, sans-serif;

            background:
                radial-gradient(circle at top, #3b2f00, transparent 35%),
                #050505;

            color: white;
        }

        .calculator {
            width: 430px;
            padding: 25px;

            background: #0d0d0d;

            border: 1px solid #4a3b00;
            border-radius: 25px;

            box-shadow:
                0 0 40px rgba(218, 165, 32, 0.18),
                0 20px 60px rgba(0, 0, 0, 0.8);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 20px;
        }

        .title {
            color: #d4af37;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .mode {
            color: #777;
            font-size: 12px;
            letter-spacing: 1px;
        }

        /* DISPLAY */

        .display-box {
            background: #050505;
            border: 1px solid #292929;
            border-radius: 16px;

            padding: 15px;
            margin-bottom: 18px;
        }

        .previous {
            height: 25px;
            color: #777;
            font-size: 14px;
            text-align: right;
            overflow: hidden;
        }

        #display {
            width: 100%;
            height: 60px;

            background: transparent;
            border: none;
            outline: none;

            color: #f4c430;

            font-size: 36px;
            font-weight: 600;

            text-align: right;
        }

        /* BUTTON GRID */

        .buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        button {
            height: 55px;

            border: 1px solid #252525;
            border-radius: 12px;

            background: #151515;
            color: #eeeeee;

            font-size: 17px;
            font-weight: 500;

            cursor: pointer;

            transition: all 0.15s ease;
        }

        button:hover {
            transform: translateY(-2px);

            border-color: #806a00;

            background: #202020;
            color: #f4c430;
        }

        button:active {
            transform: scale(0.94);
        }

        /* SCIENTIFIC BUTTONS */

        .scientific {
            background: #111111;
            color: #c7a900;

            border-color: #3b3100;
        }

        .scientific:hover {
            background: #292300;
            color: #ffd84d;
        }

        /* OPERATORS */

        .operator {
            background: #211d08;
            color: #f4c430;

            border-color: #5a4a00;

            font-size: 20px;
        }

        .operator:hover {
            background: #403500;
            color: #ffe477;
        }

        /* CLEAR */

        .clear {
            background: #260d0d;
            color: #ff6b6b;

            border-color: #571c1c;
        }

        .clear:hover {
            background: #4a1212;
            color: #ff9999;
        }

        /* EQUAL */

        .equal {
            background: #d4af37;
            color: #050505;

            border-color: #f4c430;

            font-weight: 800;
        }

        .equal:hover {
            background: #f4c430;
            color: #000000;
        }

        /* ZERO */

        .zero {
            grid-column: span 2;
        }

        /* FOOTER */

        .footer {
            text-align: center;

            margin-top: 18px;

            color: #555;
            font-size: 11px;
            letter-spacing: 1px;
        }

        /* MOBILE */

        @media (max-width: 480px) {

            .calculator {
                width: 94%;
                padding: 18px;
            }

            button {
                height: 50px;
                font-size: 15px;
            }

            #display {
                font-size: 30px;
            }
        }
    </style>
</head>


<body>

<div class="calculator">

    <!-- HEADER -->

    <div class="header">

        <div class="title">
            SCIENTIFIC
        </div>

        <div class="mode">
            DEG
        </div>

    </div>


    <!-- DISPLAY -->

    <div class="display-box">

        <div class="previous" id="previous"></div>

        <input
            type="text"
            id="display"
            value="0"
            readonly
        >

    </div>


    <!-- CALCULATOR BUTTONS -->

    <div class="buttons">

        <!-- ROW 1 -->

        <button
            class="scientific"
            onclick="appendValue('(')">
            (
        </button>

        <button
            class="scientific"
            onclick="appendValue(')')">
            )
        </button>

        <button
            class="scientific"
            onclick="square()">
            x²
        </button>

        <button
            class="scientific"
            onclick="squareRoot()">
            √
        </button>

        <button
            class="scientific"
            onclick="power()">
            xʸ
        </button>


        <!-- ROW 2 -->

        <button
            class="scientific"
            onclick="appendValue('Math.PI')">
            π
        </button>

        <button
            class="scientific"
            onclick="factorial()">
            x!
        </button>

        <button
            class="scientific"
            onclick="appendValue('Math.sin(')">
            sin
        </button>

        <button
            class="scientific"
            onclick="appendValue('Math.cos(')">
            cos
        </button>

        <button
            class="scientific"
            onclick="appendValue('Math.tan(')">
            tan
        </button>


        <!-- ROW 3 -->

        <button
            class="scientific"
            onclick="appendValue('Math.log10(')">
            log
        </button>

        <button
            class="scientific"
            onclick="appendValue('Math.log(')">
            ln
        </button>

        <button
            class="scientific"
            onclick="percentage()">
            %
        </button>

        <button
            class="clear"
            onclick="clearDisplay()">
            AC
        </button>

        <button
            class="clear"
            onclick="deleteLast()">
            ⌫
        </button>


        <!-- ROW 4 -->

        <button
            class="operator"
            onclick="appendValue('/')">
            ÷
        </button>

        <button
            class="operator"
            onclick="appendValue('*')">
            ×
        </button>

        <button
            class="operator"
            onclick="appendValue('-')">
            −
        </button>

        <button
            class="operator"
            onclick="appendValue('+')">
            +
        </button>

        <button
            class="equal"
            onclick="calculate()">
            =
        </button>


        <!-- ROW 5 -->

        <button onclick="appendValue('7')">
            7
        </button>

        <button onclick="appendValue('8')">
            8
        </button>

        <button onclick="appendValue('9')">
            9
        </button>

        <button onclick="appendValue('4')">
            4
        </button>

        <button onclick="appendValue('5')">
            5
        </button>


        <!-- ROW 6 -->

        <button onclick="appendValue('6')">
            6
        </button>

        <button onclick="appendValue('1')">
            1
        </button>

        <button onclick="appendValue('2')">
            2
        </button>

        <button onclick="appendValue('3')">
            3
        </button>

        <button onclick="appendValue('.')">
            .
        </button>


        <!-- ROW 7 -->

        <button
            class="zero"
            onclick="appendValue('0')">
            0
        </button>

    </div>


    <div class="footer">
        BLACK • GOLD EDITION
    </div>

</div>


<script>

    const display =
        document.getElementById("display");

    const previous =
        document.getElementById("previous");

    let expression = "";


    /* UPDATE DISPLAY */

    function updateDisplay() {

        if (expression === "") {

            display.value = "0";

            return;
        }

        display.value =
            expression
                .replace(/\*/g, "×")
                .replace(/\//g, "÷");
    }


    /* ADD VALUE */

    function appendValue(value) {

        expression += value;

        updateDisplay();
    }


    /* CLEAR */

    function clearDisplay() {

        expression = "";

        previous.innerText = "";

        updateDisplay();
    }


    /* DELETE LAST */

    function deleteLast() {

        expression =
            expression.slice(0, -1);

        updateDisplay();
    }


    /* SQUARE */

    function square() {

        if (expression === "") {
            return;
        }

        expression =
            "(" + expression + ")**2";

        updateDisplay();
    }


    /* SQUARE ROOT */

    function squareRoot() {

        if (expression === "") {
            return;
        }

        expression =
            "Math.sqrt(" + expression + ")";

        updateDisplay();
    }


    /* POWER */

    function power() {

        if (expression === "") {
            return;
        }

        expression += "**";

        updateDisplay();
    }


    /* PERCENTAGE */

    function percentage() {

        if (expression === "") {
            return;
        }

        expression =
            "(" + expression + ")/100";

        updateDisplay();
    }


    /* FACTORIAL */

    function factorial() {

        if (expression === "") {
            return;
        }

        let number =
            parseFloat(expression);

        if (
            number < 0 ||
            !Number.isInteger(number)
        ) {

            display.value = "Error";

            expression = "";

            return;
        }

        let result = 1;

        for (
            let i = 2;
            i <= number;
            i++
        ) {
            result *= i;
        }

        previous.innerText =
            expression + "!";

        expression =
            result.toString();

        updateDisplay();
    }


    /* CALCULATE */

    function calculate() {

        if (expression === "") {
            return;
        }

        try {

            previous.innerText =
                expression;

            let result =
                Function(
                    '"use strict"; return (' +
                    expression +
                    ')'
                )();

            if (!Number.isFinite(result)) {
                throw new Error();
            }

            expression =
                Number.isInteger(result)
                    ? result.toString()
                    : parseFloat(
                        result.toFixed(10)
                    ).toString();

            updateDisplay();

        }

        catch {

            display.value = "Error";

            expression = "";
        }
    }


    /* KEYBOARD SUPPORT */

    document.addEventListener(
        "keydown",
        function(event) {

            const key = event.key;


            if (
                key >= "0" &&
                key <= "9"
            ) {

                appendValue(key);

            }

            else if (
                "+-*/().".includes(key)
            ) {

                appendValue(key);

            }

            else if (
                key === "Enter" ||
                key === "="
            ) {

                calculate();

            }

            else if (
                key === "Backspace"
            ) {

                deleteLast();

            }

            else if (
                key === "Escape"
            ) {

                clearDisplay();
            }

        }
    );

</script>

</body>
</html>
